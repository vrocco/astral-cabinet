name: Update cosmic weather cache

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ephem
      - run: python tools/generate_cosmic_feed.py --output data/cosmic.txt
      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/cosmic.txt; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cosmic.txt
          git commit -m 'Update cosmic weather cache'
          git push
